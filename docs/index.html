<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KD · Worker monitor</title>
  <style>
:root{font-family:"Inter",system-ui,sans-serif;color:#182f32;background:#f3f5f0;font-variant-numeric:tabular-nums}
*{box-sizing:border-box}body{margin:0}header{background:#153e3c;color:#f0f6ef;display:flex;justify-content:space-between;padding:18px max(5vw,20px);align-items:center}
header span{font:13px ui-monospace,monospace}main{max-width:1280px;margin:auto;padding:28px clamp(16px,4vw,48px) 60px}
.title,.card-top{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:clamp(32px,5vw,56px);letter-spacing:-.055em;margin:12px 0 22px}h2{font-size:24px;letter-spacing:-.035em;margin:32px 0 12px}
#workers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card,form,.events{border:1px solid #c9d4cd;background:#fff;border-radius:10px}
.card{padding:20px;min-width:0}.card h3{margin:0;font-size:20px}.state{font:12px ui-monospace,monospace;border-radius:20px;padding:4px 10px;background:#e8eeea}
.running{background:#dcf4dd;color:#215b31}.stale,.stopped{background:#ffebc4;color:#744b08}.failed{background:#ffe2e2;color:#922}.completed{background:#dceef9;color:#185370}
dl{display:grid;grid-template-columns:repeat(3,1fr);gap:13px 9px}dt,small{font-size:12px;color:#4a605c}dd{margin:4px 0;font-weight:600;overflow-wrap:anywhere}
.gpu,.run{font:13px ui-monospace,monospace;overflow-wrap:anywhere}.run{color:#41615b}.events{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:14px}
th,td{padding:12px;border-bottom:1px solid #e0e6df}th{font-size:12px;color:#47605d}td:nth-child(3){overflow-wrap:anywhere}form{max-width:390px;padding:24px}
form h2{margin-top:0}label,input{display:block;width:100%;margin:8px 0}input{padding:10px;border:1px solid #97aaa2;border-radius:4px}
button{background:#1c5950;color:white;border:0;padding:10px 15px;border-radius:5px;cursor:pointer}button[hidden],[hidden]{display:none!important}
#notice:not(:empty){background:#fff4d7;padding:12px;border-radius:6px}@media(max-width:680px){#workers{grid-template-columns:1fr}th,td{padding:8px}}
.panel{margin:24px 0;padding:20px;background:#fff;border:1px solid #c9d4cd;border-radius:10px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel-head h2,.panel-head h3{margin:8px 0}.panel-head label{width:auto;display:flex;align-items:center;gap:8px}
select{font:inherit;border:1px solid #9eafa6;border-radius:5px;background:white;padding:6px 10px}
#charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:16px 0 28px}
figure{margin:0;background:#f6f8f5;padding:12px;border-radius:6px}figcaption{font-weight:600}
figure svg{width:100%;height:78px}figure small{display:block}#plan-note,#history-note{font-size:13px;color:#4a605c}
#summary{font-size:18px;color:#38554d}progress{width:100%;height:8px;accent-color:#23725b}
.panel .events{max-height:480px;overflow:auto}.panel th{position:sticky;top:0;background:#edf2ec}

</style>


</head>
<body>
  <header><strong>KD / Research</strong><span id="connection" role="status">Connecting…</span></header>
  <main>
    <div class="title"><h1>Worker monitor</h1><button hidden id="logout">Sign out</button></div>
    <p id="notice" role="status"></p>
    <form id="login" hidden>
      <h2>Viewer sign-in</h2>
      <label>Email<input id="email" type="email" autocomplete="username" required></label>
      <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
      <button>Sign in</button>
    </form>
    <section id="dashboard" hidden>
      <p id="summary"></p>
      <div id="workers"></div>
      <section class="panel">
        <div class="panel-head"><h2>Worker detail</h2><label>Notebook
          <select id="focus"><option value="0">Worker 0</option><option value="1">Worker 1</option><option value="2">Worker 2</option><option value="3">Worker 3</option></select></label></div>
        <h3>Performance history</h3>
        <p id="history-note"></p><div id="charts"></div>
        <div class="panel-head"><h3>Run inventory</h3><label>Show
          <select id="filter"><option value="">All runs</option><option>Audited</option><option>Active</option><option>Pending</option><option>Resumable</option><option>Unconfirmed</option><option>Ready</option><option>Ready to resume</option><option>Waiting for teacher</option><option>Waiting for bank</option><option>Claimed</option><option>Original notebook</option></select></label></div>
        <p id="plan-note"></p>
        <div class="events"><table><thead><tr><th>Dataset</th><th>Model</th><th>Method</th><th>Seed</th><th>Epochs</th><th>Status</th><th>Worker or dependency</th><th>Observed time</th></tr></thead><tbody id="inventory"></tbody></table></div>
      </section>
      <h2>Recent events</h2>
      <div class="events"><table><thead><tr><th>Time</th><th>Worker</th><th>Run</th><th>Event</th></tr></thead><tbody id="events"></tbody></table></div>
    </section>
  </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script>

  {"id": "kaggle-v2.tiny_imagenet200.mobilenetv4_conv_small.disagreement.2026", "worker": 1, "dataset": "tiny_imagenet200", "model": "mobilenetv4_conv_small", "arm": "disagreement", "seed": 2026, "epochs": 60, "updates": 42240},
  {"id": "kaggle-v2.tiny_imagenet200.mobilenetv4_conv_small.uniform.2026", "worker": 1, "dataset": "tiny_imagenet200", "model": "mobilenetv4_conv_small", "arm": "uniform", "seed": 2026, "epochs": 60, "updates": 42240}

<script>
"use strict";
const el = id => document.getElementById(id);
function node(tag, value, cls) {
  const n = document.createElement(tag);
  if (value != null) n.textContent = value;
  if (cls) n.className = cls;
  return n;
}
const fmt = (v, digits = 0, unit = "") => Number.isFinite(v) ? v.toFixed(digits) + unit : "—";
const localTime = t => new Date(t).toLocaleString();
let workers = [], events = [], jobs = [];
let trends = [], activity = [], memory = [], historyReady = false, nextHistory = 0;
const plans = window.KD_PLAN || [];
function duration(seconds) {
  if (!Number.isFinite(seconds)) return "—";
  const minutes = Math.floor(Math.max(seconds,0) / 60);
  return minutes >= 60 ? Math.floor(minutes/60)+"h "+minutes%60+"m" : minutes+"m";
}
function runState(plan, w) {
  const s=w?.sample, d=s?.details;
  if (d?.audited?.includes(plan.id)) return "Audited";
  if (s?.run_id===plan.id && s.status==="running")
    return Date.now()-Date.parse(w.received_at)>90000 ? "Last reported" : "Active";
  if (d?.resumable?.includes(plan.id)) return "Resumable";
  return Array.isArray(d?.audited) ? "Pending" : "Unconfirmed";
}
function queueState(j) {
  if (j.state === "audited") return "Audited";
  if (j.state === "legacy") return "Original notebook";
  const active = x => x.state === "claimed" && Date.parse(x.expires) > Date.now();
  if (active(j)) return "Claimed";
  if (j.teacher && !jobs.some(t => t.run_id === j.teacher && t.state === "audited")) return "Waiting for teacher";
  if (j.bank && !j.bank_ready && jobs.some(b => b.bank === j.bank && active(b))) return "Waiting for bank";
  return j.resumable ? "Ready to resume" : "Ready";
}
function queueOwner(j) {
  const state=queueState(j);
  if (state==="Original notebook") return "Worker "+j.original_worker+" (original)";
  if (state==="Claimed" || state==="Audited") return "Worker "+j.worker;
  if (state==="Waiting for teacher") return j.teacher;
  if (state==="Waiting for bank") return j.bank;
  return "Next free worker";
}
function chart(title, key, points, percent) {
  const figure=node("figure");
  figure.append(node("figcaption",title));
  const values=points.filter(p=>Number.isFinite(p[key]));
  if (!values.length) {figure.append(node("small","Awaiting samples"));return figure;}
  const ns="http://www.w3.org/2000/svg", svg=document.createElementNS(ns,"svg");
  svg.setAttribute("viewBox","0 0 240 75"); svg.setAttribute("role","img");
  svg.setAttribute("aria-label",title+" over time");
  const hi=percent?100:Math.max(0.01,...values.map(p=>p[key]));
  const start=Date.parse(points[0].sampled_at), end=Date.parse(points.at(-1).sampled_at);
  let segment=[], previous=null;
  function finish() {
    if (!segment.length) return;
    const line=document.createElementNS(ns,segment.length===1?"circle":"polyline");
    if (segment.length===1) {
      line.setAttribute("cx",segment[0][0]);line.setAttribute("cy",segment[0][1]);line.setAttribute("r","2");
      line.setAttribute("fill","#20745d");
    } else {line.setAttribute("points",segment.join(" "));line.setAttribute("fill","none");}
    line.setAttribute("stroke","#20745d");line.setAttribute("stroke-width","2");svg.append(line);segment=[];
  }
  for (const p of points) {
    const t=Date.parse(p.sampled_at);
    if (!Number.isFinite(p[key]) || (previous && (p.run_id!==previous.run_id ||
        t-Date.parse(previous.sampled_at)>600000))) finish();
    if (Number.isFinite(p[key])) segment.push([3+234*(t-start)/Math.max(1,end-start),71-66*p[key]/hi]);
    previous=p;
  }
  finish();figure.append(svg,node("small","Scale 0–"+fmt(hi,percent?0:2,percent?"%":"")+
    " · Latest "+fmt(values.at(-1)[key],percent?1:3,percent?"%":"")));
  return figure;
}
function renderDetail() {
  const id=Number(el("focus").value), w=workers.find(x=>x.worker_id===id);
  const items=jobs.length ? plans : plans.filter(p=>p.worker===id), filter=el("filter").value;
  const details=w?.sample?.details;
  el("plan-note").textContent=jobs.length ? "Shared inventory for all four workers. Original notebook means its runs are awaiting migration." : Array.isArray(details?.selected)
    ? details.selected.length+" selected this session. Audited fits have passed the Hugging Face evidence check."
    : "Assignment is known. Completion is unconfirmed until this worker sends an audit inventory.";
  const rows=[];
  for (const p of items) {
    const job=jobs.find(j=>j.run_id===p.id);
    const state=job ? queueState(job) : runState(p,w);
    if (filter && state!==filter) continue;
    const observations=activity.filter(x=>x.run_id===p.id);
    const seconds=observations.length ? observations.reduce((v,x)=>v+x.observed_seconds,0) : null;
    const tr=node("tr");
    for (const value of [p.dataset,p.model,p.arm,p.seed,p.epochs,state,job ? queueOwner(job) : "Worker "+p.worker,duration(seconds)])
      tr.append(node("td",value));
    rows.push(tr);
  }
  if (!rows.length) {
    const tr=node("tr"),td=node("td","No matching runs.");td.colSpan=8;tr.append(td);rows.push(tr);
  }
  el("inventory").replaceChildren(...rows);
  const points=(historyReady?trends:memory).filter(p=>p.worker_id===id);
  el("history-note").textContent=(historyReady ? "Five-minute samples · last 12 hours" : "Live samples collected in this tab")+
    (points.length?" · "+localTime(points[0].sampled_at)+" – "+localTime(points.at(-1).sampled_at):"");
  el("charts").replaceChildren(chart("Batch loss","loss",points,false),chart("Batch accuracy","accuracy",points,true),
    chart("GPU 0 utilization","gpu",points,true),chart("CPU utilization","cpu",points,true));
}
function render() {
  const cards = [];
  for (let id = 0; id < 4; id++) {
    const w = workers.find(x => x.worker_id === id), s = w?.sample || {};
    const age = w ? Math.max(0, Math.floor((Date.now() - Date.parse(w.received_at)) / 1000)) : null;
    const state = !w ? "No report" : s.status === "running" && age > 90 ? "stale" : s.status;
    const box = node("article", null, "card"), head = node("div", null, "card-top");
    const label = state==="running" && jobs.length
      ? (s.run_id?.startsWith("waiting for a ready fit") ? "waiting" :
         Number.isFinite(s.epoch) ? "training" : "preparing") : state;
    head.append(node("h3", "Worker " + id), node("span", label, "state " + state));
    box.append(head, node("p", s.run_id || "Awaiting worker", "run"));
    const owned=plans.filter(p=>p.worker===id), d=s.details || {};
    const plan=plans.find(p=>p.id===s.run_id);
    const progress=Number.isFinite(d.update) ? d.update : Number(/Local checkpoint at update (\d+)/.exec(s.comment||"")?.[1]);
    const activeEnd=state==="running" ? Date.now() : Date.parse(s.sampled_at);
    const elapsed=(activeEnd-Date.parse(s.started_at))/1000;
    const observed=activity.find(a=>a.worker_id===id && a.run_id===s.run_id);
    const done=owned.filter(p=>runState(p,w)==="Audited").length;
    if (jobs.length) {
      const current=jobs.find(j=>j.worker===id && queueState(j)==="Claimed");
      const audited=jobs.filter(j=>j.worker===id && j.state==="audited").length;
      box.append(node("p",audited+" audited"+(current ? " · Claimed "+current.run_id : "")));
    } else box.append(node("p",owned.length+" assigned · "+(Array.isArray(d.audited)
      ? done+" audited · "+(owned.length-done)+" unfinished" : "awaiting audit inventory")));
    if (plan && Number.isFinite(progress)) {
      const bar=node("progress");bar.max=plan.updates;bar.value=progress;bar.setAttribute("aria-label","Fit updates");
      box.append(bar,node("small",progress.toLocaleString()+" / "+plan.updates.toLocaleString()+" updates"));
    }
    const dl = node("dl");
    for (const [name, value] of [["Model",s.model ?? "—"],["Epoch",s.epoch ?? "—"],["CPU",fmt(s.cpu,1,"%")],
      ["Batch loss",fmt(s.loss,4)],["Batch accuracy",fmt(s.accuracy,1,"%")],
      ["Session elapsed",duration(elapsed)],["Current run elapsed",duration(activeEnd/1000-d.fit_started_at)],
      ["Fit observed",duration(observed?.observed_seconds)],
      ["Validation",fmt(d.validation_accuracy,1,"%")+(d.validation_epoch?" (epoch "+d.validation_epoch+")":"")],
      ["Learning rate",fmt(d.learning_rate,6)]]) {
      const cell = node("div"); cell.append(node("dt",name),node("dd",value)); dl.append(cell);
    }
    box.append(dl);
    const gpus = s.gpus || [];
    if (!gpus.length) box.append(node("p","GPU telemetry unavailable","gpu"));
    for (const g of gpus) box.append(node("p", "GPU " + g.index + " · " + fmt(g.utilization,0,"%") +
      " · " + fmt(g.used_mib) + " / " + fmt(g.total_mib) + " MiB","gpu"));
    box.append(node("p",s.comment || "Waiting for the first update."),
      node("small",w ? "Last received " + localTime(w.received_at) : "No update received"));
    cards.push(box);
  }
  el("workers").replaceChildren(...cards);
  el("summary").textContent=plans.length+" scheduled fits across four notebooks";
  if (jobs.length) {
    const counts=new Map();
    for (const j of jobs) {const k=queueState(j);counts.set(k,(counts.get(k)||0)+1);}
    el("summary").textContent=jobs.length+" fits · "+Array.from(counts,([k,n])=>n+" "+k.toLowerCase()).join(" · ");
  }
  renderDetail();
  const rows = events.map(e => {
    const tr = node("tr");
    for (const v of [localTime(e.recorded_at),e.worker_id,e.run_id,e.comment]) tr.append(node("td",v));
    return tr;
  });
  if (!rows.length) {
    const tr = node("tr"), td = node("td","No events received yet."); td.colSpan=4; tr.append(td); rows.push(tr);
  }
  el("events").replaceChildren(...rows);
}
let client, channel, version=0, viewer=null, request=0, timer, fallback;
async function refresh() {
  if (!viewer) return;
  const ticket=++request, v=version;
  try {
    const [w,e,q] = await Promise.all([client.from("kd_workers").select("*"),
      client.from("kd_events").select("*").order("id",{ascending:false}).limit(40),
      client.from("kd_jobs").select("run_id,original_worker,teacher,bank,state,resumable,bank_ready,worker,expires")]);
    if (v!==version || ticket!==request) return;
    if (w.error || e.error) throw w.error || e.error;
    workers=w.data; events=e.data; if (!q.error) jobs=q.data;
    for (const row of workers) {
      const s=row.sample;
      if (!memory.some(p=>p.worker_id===row.worker_id && p.sampled_at===s.sampled_at))
        memory.push({worker_id:row.worker_id,sampled_at:s.sampled_at,run_id:s.run_id,loss:s.loss,
          accuracy:s.accuracy,cpu:s.cpu,gpu:s.gpus?.[0]?.utilization});
    }
    memory=memory.slice(-600).sort((a,b)=>Date.parse(a.sampled_at)-Date.parse(b.sampled_at));
    el("notice").textContent=""; render();
    if (Date.now()>=nextHistory) {
      nextHistory=Date.now()+60000;
      const [t,a]=await Promise.all([client.from("kd_trends").select("*")
          .gte("bucket",new Date(Date.now()-12*3600000).toISOString()).order("sampled_at"),
        client.from("kd_run_activity").select("*")]);
      if (v!==version) return;
      historyReady=!t.error;
      if (!t.error) trends=t.data;
      if (!a.error) activity=a.data;
      render();
    }
  } catch (err) {
    if (v===version && ticket===request) el("notice").textContent="Could not refresh. " + err.message;
  }
}
function schedule() { clearTimeout(timer); timer=setTimeout(refresh,150); }
function showSession(session) {
  const user=session?.user, allowed=user?.app_metadata?.kd_monitor==="viewer";
  const id=allowed ? user.id : null;
  el("login").hidden=Boolean(user); el("logout").hidden=!user; el("dashboard").hidden=!allowed;
  if (!allowed) {
    el("connection").textContent=user ? "Access required" : "Signed out";
    el("notice").textContent=user ? "Ask the project owner to grant this account viewer access, then sign in again." : "";
  }
  if (viewer===id) return;
  version++; viewer=id; clearTimeout(timer); clearInterval(fallback);
  if (channel) {client.removeChannel(channel); channel=null;}
  workers=[]; events=[]; jobs=[]; trends=[]; activity=[]; memory=[]; historyReady=false;nextHistory=0;render();
  if (!id) return;
  const v=version;
  el("connection").textContent="Connecting"; refresh();
  channel=client.channel("kd-dashboard-" + v)
    .on("postgres_changes",{event:"*",schema:"public",table:"kd_workers"},schedule)
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"kd_events"},schedule)
    .subscribe(status=>{
      if(v!==version) return;
      el("connection").textContent=status==="SUBSCRIBED" ? "Live" : "Reconnecting · periodic refresh";
      schedule();
    });
  fallback=setInterval(refresh,60000);
}
function init() {
  el("focus").onchange=renderDetail;el("filter").onchange=renderDetail;
  const config=window.KD_CONFIG;
  if (!config?.url || !config.key || !window.supabase) {
    el("connection").textContent="Setup required";
    el("notice").textContent="Set the Supabase URL and public key in config.js and allow the dashboard SDK to load.";
    return;
  }
  client=window.supabase.createClient(config.url,config.key);
  client.auth.onAuthStateChange((_event,session)=>setTimeout(()=>showSession(session),0));
  el("login").addEventListener("submit",async e=>{
    e.preventDefault();
    const {error}=await client.auth.signInWithPassword({email:el("email").value.trim(),password:el("password").value});
    el("notice").textContent=error ? error.message : ""; if (!error) el("password").value="";
  });
  el("logout").onclick=async()=>{const {error}=await client.auth.signOut(); if(error) el("notice").textContent=error.message;};
  setInterval(()=>{if(viewer) render();},10000);
  window.addEventListener("online",schedule);
}
init();

</script>
