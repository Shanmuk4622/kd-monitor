<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KD · Worker monitor</title>
  <style>
:root{font-family:"Inter",system-ui,sans-serif;color:#182f32;background:#f3f5f0;font-variant-numeric:tabular-nums}
*{box-sizing:border-box}body{margin:0}header{background:#153e3c;color:#f0f6ef;display:flex;justify-content:space-between;padding:18px max(5vw,20px);align-items:center}
header span{font:13px ui-monospace,monospace}main{max-width:1280px;margin:auto;padding:28px clamp(16px,4vw,48px) 60px}
.title,.card-top{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:clamp(32px,5vw,56px);letter-spacing:-.055em;margin:12px 0 22px}h2{font-size:24px;letter-spacing:-.035em;margin:32px 0 12px}
#workers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card,form,.events{border:1px solid #c9d4cd;background:#fff;border-radius:10px}
.card{padding:20px;min-width:0}.card h3{margin:0;font-size:20px}.state{font:12px ui-monospace,monospace;border-radius:20px;padding:4px 10px;background:#e8eeea}
.running{background:#dcf4dd;color:#215b31}.stale,.stopped{background:#ffebc4;color:#744b08}.failed{background:#ffe2e2;color:#922}.completed{background:#dceef9;color:#185370}
dl{display:grid;grid-template-columns:repeat(3,1fr);gap:13px 9px}dt,small{font-size:12px;color:#4a605c}dd{margin:4px 0;font-weight:600;overflow-wrap:anywhere}
.gpu,.run{font:13px ui-monospace,monospace;overflow-wrap:anywhere}.run{color:#41615b}.events{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:14px}
th,td{padding:12px;border-bottom:1px solid #e0e6df}th{font-size:12px;color:#47605d}td:nth-child(3){overflow-wrap:anywhere}form{max-width:390px;padding:24px}
form h2{margin-top:0}label,input{display:block;width:100%;margin:8px 0}input{padding:10px;border:1px solid #97aaa2;border-radius:4px}
button{background:#1c5950;color:white;border:0;padding:10px 15px;border-radius:5px;cursor:pointer}button[hidden],[hidden]{display:none!important}
#notice:not(:empty){background:#fff4d7;padding:12px;border-radius:6px}@media(max-width:680px){#workers{grid-template-columns:1fr}th,td{padding:8px}}
  </style>
</head>
<body>
  <header><strong>KD / Research</strong><span id="connection" role="status">Connecting…</span></header>
  <main>
    <div class="title"><h1>Worker monitor</h1><button hidden id="logout">Sign out</button></div>
    <p id="notice" role="status"></p>
    <form id="login" hidden>
      <h2>Viewer sign-in</h2>
      <label>Email<input id="email" type="email" autocomplete="username" required></label>
      <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
      <button>Sign in</button>
    </form>
    <section id="dashboard" hidden>
      <div id="workers"></div>
      <h2>Recent events</h2>
      <div class="events"><table><thead><tr><th>Time</th><th>Worker</th><th>Run</th><th>Event</th></tr></thead><tbody id="events"></tbody></table></div>
    </section>
  </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script>
<script>
// Public browser configuration. Only use the project URL and its publishable (or legacy anon) key.
window.KD_CONFIG = {
  url: "https://fbdfvjyiubbywpfkojqo.supabase.co",
  key: "sb_publishable_xCmALxJ3KQ84tepEMv7uxw_0UgaFeHx"
};
</script>
<script>
"use strict";
const el = id => document.getElementById(id);
function node(tag, value, cls) {
  const n = document.createElement(tag);
  if (value != null) n.textContent = value;
  if (cls) n.className = cls;
  return n;
}
const fmt = (v, digits = 0, unit = "") => Number.isFinite(v) ? v.toFixed(digits) + unit : "—";
const localTime = t => new Date(t).toLocaleString();
let workers = [], events = [];
function render() {
  const cards = [];
  for (let id = 0; id < 4; id++) {
    const w = workers.find(x => x.worker_id === id), s = w?.sample || {};
    const age = w ? Math.max(0, Math.floor((Date.now() - Date.parse(w.received_at)) / 1000)) : null;
    const state = !w ? "No report" : s.status === "running" && age > 90 ? "stale" : s.status;
    const box = node("article", null, "card"), head = node("div", null, "card-top");
    head.append(node("h3", "Worker " + id), node("span", state, "state " + state));
    box.append(head, node("p", s.run_id || "Awaiting worker", "run"));
    const dl = node("dl");
    for (const [name, value] of [["Model",s.model ?? "—"],["Epoch",s.epoch ?? "—"],["CPU",fmt(s.cpu,1,"%")],
      ["Batch loss",fmt(s.loss,4)],["Batch accuracy",fmt(s.accuracy,1,"%")]]) {
      const cell = node("div"); cell.append(node("dt",name),node("dd",value)); dl.append(cell);
    }
    box.append(dl);
    const gpus = s.gpus || [];
    if (!gpus.length) box.append(node("p","GPU telemetry unavailable","gpu"));
    for (const g of gpus) box.append(node("p", "GPU " + g.index + " · " + fmt(g.utilization,0,"%") +
      " · " + fmt(g.used_mib) + " / " + fmt(g.total_mib) + " MiB","gpu"));
    box.append(node("p",s.comment || "Waiting for the first update."),
      node("small",w ? "Last received " + localTime(w.received_at) : "No update received"));
    cards.push(box);
  }
  el("workers").replaceChildren(...cards);
  const rows = events.map(e => {
    const tr = node("tr");
    for (const v of [localTime(e.recorded_at),e.worker_id,e.run_id,e.comment]) tr.append(node("td",v));
    return tr;
  });
  if (!rows.length) {
    const tr = node("tr"), td = node("td","No events received yet."); td.colSpan=4; tr.append(td); rows.push(tr);
  }
  el("events").replaceChildren(...rows);
}
let client, channel, version=0, viewer=null, request=0, timer, fallback;
async function refresh() {
  if (!viewer) return;
  const ticket=++request, v=version;
  try {
    const [w,e] = await Promise.all([client.from("kd_workers").select("*"),
      client.from("kd_events").select("*").order("id",{ascending:false}).limit(40)]);
    if (v!==version || ticket!==request) return;
    if (w.error || e.error) throw w.error || e.error;
    workers=w.data; events=e.data; el("notice").textContent=""; render();
  } catch (err) {
    if (v===version && ticket===request) el("notice").textContent="Could not refresh. " + err.message;
  }
}
function schedule() { clearTimeout(timer); timer=setTimeout(refresh,150); }
function showSession(session) {
  const user=session?.user, allowed=user?.app_metadata?.kd_monitor==="viewer";
  const id=allowed ? user.id : null;
  el("login").hidden=Boolean(user); el("logout").hidden=!user; el("dashboard").hidden=!allowed;
  if (!allowed) {
    el("connection").textContent=user ? "Access required" : "Signed out";
    el("notice").textContent=user ? "Ask the project owner to grant this account viewer access, then sign in again." : "";
  }
  if (viewer===id) return;
  version++; viewer=id; clearTimeout(timer); clearInterval(fallback);
  if (channel) {client.removeChannel(channel); channel=null;}
  workers=[]; events=[]; render();
  if (!id) return;
  const v=version;
  el("connection").textContent="Connecting"; refresh();
  channel=client.channel("kd-dashboard-" + v)
    .on("postgres_changes",{event:"*",schema:"public",table:"kd_workers"},schedule)
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"kd_events"},schedule)
    .subscribe(status=>{
      if(v!==version) return;
      el("connection").textContent=status==="SUBSCRIBED" ? "Live" : "Reconnecting · periodic refresh";
      schedule();
    });
  fallback=setInterval(refresh,60000);
}
function init() {
  const config=window.KD_CONFIG;
  if (!config?.url || !config.key || !window.supabase) {
    el("connection").textContent="Setup required";
    el("notice").textContent="Set the Supabase URL and public key in config.js and allow the dashboard SDK to load.";
    return;
  }
  client=window.supabase.createClient(config.url,config.key);
  client.auth.onAuthStateChange((_event,session)=>setTimeout(()=>showSession(session),0));
  el("login").addEventListener("submit",async e=>{
    e.preventDefault();
    const {error}=await client.auth.signInWithPassword({email:el("email").value.trim(),password:el("password").value});
    el("notice").textContent=error ? error.message : ""; if (!error) el("password").value="";
  });
  el("logout").onclick=async()=>{const {error}=await client.auth.signOut(); if(error) el("notice").textContent=error.message;};
  setInterval(()=>{if(viewer) render();},10000);
  window.addEventListener("online",schedule);
}
init();
</script>
</body></html>
